name: AMARadio CI Workflow

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleFossDebug assemblePlayDebug --stacktrace

      - name: Upload FOSS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AMARadio-FOSS-Debug-APK
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Upload Play Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AMARadio-Play-Debug-APK
          path: app/build/outputs/apk/play/debug/*.apk

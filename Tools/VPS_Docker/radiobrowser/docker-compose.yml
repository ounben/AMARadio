services:
  radiobrowser-db:
    image: mariadb:10.11
    container_name: radiobrowser_db
    restart: always
    hostname: radiobrowser-db
    command: --bind-address=0.0.0.0 --skip-name-resolve --default-authentication-plugin=mysql_native_password--innodb-buffer-pool-size=768M --innodb-buffer-pool-instances=1
    env_file:
      - .env
    environment:
      MARIADB_USER: ${DB_USER:-radiobrowser}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-radiobrowser_db}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-${DB_PASSWORD}}
    volumes:
      - radiobrowser_mariadb:/var/lib/mysql
    networks:
      - radiobrowser_net

  radiobrowser-api:
    image: radiobrowser-radio-api:latest
    container_name: radiobrowser_api
    restart: always
    depends_on:
      - radiobrowser-db
    command: ["--mirror", "https://de1.api.radio-browser.info", "--mirror", "https://de1.api.radio-browser.info"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://${DB_USER:-radiobrowser}:${DB_PASSWORD}@radiobrowser-db:3306/${DB_NAME:-radiobrowser_db}
      - RUST_LOG=info
      - HOST=0.0.0.0
      - PORT=8080
    networks:
      - radiobrowser_net

  radiobrowser-web:
    image: nginx:alpine
    container_name: radiobrowser_web
    restart: always
    volumes:
      - radiobrowser_exports:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - radiobrowser_net

  radiobrowser-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: radiobrowser_cloudflare
    restart: always
    command: tunnel run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - radiobrowser_net

  radiobrowser_exporter:
    build:
      context: ./exporter
    container_name: radiobrowser_exporter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - radiobrowser_exports:/export
    depends_on:
      - radiobrowser-db
    networks:
      - radiobrowser_net

  radiobrowser_static:
    image: nginx:alpine
    container_name: radiobrowser_static
    restart: unless-stopped
    volumes:
      - radiobrowser_exports:/usr/share/nginx/html:ro
    networks:
      - radiobrowser_net

networks:
  radiobrowser_net:
    driver: bridge

volumes:
  radiobrowser_mariadb:
  radiobrowser_exports:

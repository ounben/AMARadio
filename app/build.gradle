apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'

def getAvailableLocales() {
    def tree = fileTree(dir: 'src/main/res', include: '**/strings.xml')
    return tree.collect {
        def lang = it.getParentFile().getName() - "values-" - "values"
        lang = lang.replace("-r", "-")
        if (lang.empty) {
            lang = "en"
        }
        lang
    }
}

android {
    namespace 'com.ounben.amaradio'
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=androidx.media3.common.util.UnstableApi"]
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    defaultConfig {
        applicationId "com.ounben.amaradio"
        minSdkVersion 26
        targetSdkVersion 35

        versionCode 103
        versionName "0.96"

        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }

        resValue 'string', 'app_name_untranslated', 'AMARadio'
        resValue 'string', 'version_name', versionName

        def escapedLocales = getAvailableLocales()
        resValue 'string', 'available_locales', escapedLocales.join(",")
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            lintOptions {
                disable 'MissingTranslation'
            }
        }
    }

    lint {
        abortOnError true
        lintConfig = file("lint.xml")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        animationsDisabled = true
        unitTests.returnDefaultValues = true
    }
}


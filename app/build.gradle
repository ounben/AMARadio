plugins {
    id 'com.android.application'
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def appVersion = "1.14"

base {
    archivesName = "AMARadio_${appVersion}"
}

def getAvailableLocales() {
    def tree = fileTree(dir: 'src/main/res', include: '**/strings.xml')
    return tree.collect {
        def lang = it.getParentFile().getName() - "values-" - "values"
        lang = lang.replace("-r", "-")
        if (lang.empty) {
            lang = "en"
        }
        lang
    }
}

android {
    namespace 'com.ounben.amaradio'
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
            freeCompilerArgs.add("-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi")
        }
    }

    buildFeatures {
        viewBinding false
        aidl true
        compose true
        resValues true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    defaultConfig {
        applicationId "com.ounben.amaradio"
        minSdkVersion 26
        targetSdkVersion 37

        versionCode 136
        versionName appVersion

        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }

        resValue 'string', 'app_name_untranslated', 'AMARadio'
        resValue 'string', 'version_name', appVersion
        resValue 'string', 'git_hash', "N/A"
        resValue 'string', 'build_date', new Date().format('yyyy-MM-dd HH:mm:ss')

        def escapedLocales = getAvailableLocales()
        resValue 'string', 'available_locales', escapedLocales.join(",")
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        animationsDisabled = true
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            output.outputFileName.set("AMARadio_${appVersion}.apk")
        }
    }
}

dependencies {
    implementation libs.androidx.media
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.preference
    implementation libs.androidx.tvprovider

    implementation libs.okhttp
    implementation libs.okhttp.coroutines
    implementation libs.coil

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose
    implementation libs.androidx.navigation.compose
    implementation libs.coil.compose
    implementation libs.coil.svg

    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.exoplayer.hls
    implementation libs.androidx.media3.datasource
    implementation libs.androidx.media3.datasource.okhttp
    implementation libs.androidx.media3.ui
    implementation libs.androidx.media3.common
    implementation libs.androidx.media3.session

    implementation libs.androidx.room.runtime
    ksp libs.androidx.room.compiler
    implementation libs.androidx.room.ktx
    implementation libs.androidx.room.paging
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.guava
    implementation libs.kotlinx.serialization.json

    implementation libs.androidx.paging.runtime
    implementation libs.androidx.paging.compose

    // Google Cast & Integrity
    implementation libs.play.services.integrity
    implementation libs.play.review
    implementation libs.androidx.work.runtime.ktx

    testImplementation libs.junit
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.vintage.engine
    testRuntimeOnly libs.junit.platform.launcher
}

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}

import org.jetbrains.kotlin.gradle.dsl.JvmTarget

def getAvailableLocales() {
    def tree = fileTree(dir: 'src/main/res', include: '**/strings.xml')
    return tree.collect {
        def lang = it.getParentFile().getName() - "values-" - "values"
        lang = lang.replace("-r", "-")
        if (lang.empty) {
            lang = "en"
        }
        lang
    }
}

android {
    namespace 'com.ounben.amaradio'
    compileSdkVersion 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_21
            freeCompilerArgs.add("-opt-in=androidx.media3.common.util.UnstableApi")
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
        compose true
    }

    defaultConfig {
        applicationId "com.ounben.amaradio"
        minSdkVersion 26
        targetSdkVersion 37

        versionCode 107
        versionName "0.99.1"

        vectorDrawables.useSupportLibrary = true

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }

        resValue 'string', 'app_name_untranslated', 'AMARadio'
        resValue 'string', 'version_name', versionName

        def escapedLocales = getAvailableLocales()
        resValue 'string', 'available_locales', escapedLocales.join(",")
    }


    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            lintOptions {
                disable 'MissingTranslation'
            }
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError true
        lintConfig = file("lint.xml")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
        animationsDisabled = true
        unitTests.returnDefaultValues = true
    }
}

